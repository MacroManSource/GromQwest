async function rfAdd(){const id=$('#rf4').value;if(!id)return toast('Выберите, что выдать');if(chk((await sb.from('referral_rewards').insert({role:$('#rf1').value,threshold:Math.max(0,+$('#rf2').value||0),reward_kind:$('#rf3').value,reward_id:id})).error))return;adRef()}
async function rfDel(id){if(chk((await sb.from('referral_rewards').delete().eq('id',id)).error))return;adRef()}
async function adDel(k,id){const{error}=await sb.rpc(k=='post'?'delete_post':'delete_comment',k=='post'?{pid:id}:{cid:id});if(chk(error))return;toast('Удалено');adTab()}
